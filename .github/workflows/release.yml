name: release

# Push a tag like v2026.10.29 (it must match the version in package.json) to build the installer and attach it to a DRAFT GitHub release.
# You can also run it by hand (Actions > release > Run workflow): that only builds the installer and uploads it as a download on the run.
#
# Two jobs on purpose: "build" runs the project's code and its dependencies' install scripts with a READ-ONLY token and no saved git
# credentials. Only "release" has the write permission, and all it does is take the finished files and attach them to a draft release.
# Actions are pinned to exact commits (the comment names the version line).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$TAG" ]; then echo "::error::tag $TAG does not match package.json version v$v"; exit 1; fi
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Audit (the runtime packages must be clean)
        run: npm audit --omit=dev
      - name: Tests
        run: npm test
      - name: Build the installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object { $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$h  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: installer
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: installer
          path: dist
      - name: Draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
